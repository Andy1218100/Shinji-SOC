services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proxsecure}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proxsecure}
      POSTGRES_DB: ${POSTGRES_DB:-proxsecure}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proxsecure}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      # Desactiva la cache de prompts en RAM de llama-server (--cache-ram,
      # 8 GiB por defecto). Entradas de esa cache quedaron corruptas y cada
      # vez que se reusaban el modelo devolvia basura (mezcla de alfabetos)
      # para ese prompt hasta reiniciar Ollama. Costo: solo se reutiliza el
      # prompt inmediatamente anterior, no los de antes.
      LLAMA_ARG_CACHE_RAM: "0"
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  server:
    build: ./server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # El .env montado (abajo) lo reescribe la pagina de Configuracion.
      PROX_SECURE_ENV_FILE: /config/.env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-proxsecure}:${POSTGRES_PASSWORD:-proxsecure}@db:5432/${POSTGRES_DB:-proxsecure}
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
      - ./.env:/config/.env
      # Lectura del estado de los respaldos y pedido de "Respaldar ahora".
      - ./backups:/backups

  backup:
    # Misma imagen que la base: su pg_dump es de la misma version.
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: ["/bin/sh", "/scripts/backup_loop.sh"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./scripts/backup_loop.sh:/scripts/backup_loop.sh:ro
      - ./backups:/backups
      - ./.env:/config/.env:ro

volumes:
  db_data:
  ollama_data:

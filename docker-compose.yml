services:
  db:
    # Version fija: el binario de TimescaleDB tiene que coincidir con la
    # extension instalada en la base (ALTER EXTENSION al actualizar) y con
    # la de los respaldos. Ver docs/REFERENCIA.md, "Actualizar versiones".
    image: timescale/timescaledb:2.32.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shinjisoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shinjisoc}
      POSTGRES_DB: ${POSTGRES_DB:-shinjisoc}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # Solo desde este equipo: la base no tiene por que verse en la red.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shinjisoc}"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    # Version fija: con "latest" cualquier "docker compose pull" cambiaba el
    # motor de la IA sin aviso (la basura de la IA aparecio con la 0.40.16).
    # Ver docs/REFERENCIA.md, "Actualizar versiones".
    image: ollama/ollama:0.40.16
    restart: unless-stopped
    environment:
      # Desactiva la cache de prompts en RAM de llama-server (--cache-ram,
      # 8 GiB por defecto). Entradas de esa cache quedaron corruptas y cada
      # vez que se reusaban el modelo devolvia basura (mezcla de alfabetos)
      # para ese prompt hasta reiniciar Ollama. Costo: solo se reutiliza el
      # prompt inmediatamente anterior, no los de antes.
      LLAMA_ARG_CACHE_RAM: "0"
    volumes:
      - ollama_data:/root/.ollama
    ports:
      # Solo desde este equipo: la API de Ollama no pide autenticacion.
      - "127.0.0.1:11434:11434"

  server:
    build: ./server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # El .env montado (abajo) lo reescribe la pagina de Configuracion.
      SHINJI_SOC_ENV_FILE: /config/.env
      # La URL de la base la arma el servidor con POSTGRES_USER, _PASSWORD y
      # _DB del .env, escapando la contrasena (una con "@" o "/" rompia la
      # URL armada aca).
      POSTGRES_HOST: db
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      # HTTP sin cifrar. El acceso desde afuera va por el tunel de
      # Cloudflare (cloudflared, abajo), que entra por la red interna de
      # Docker: con SERVER_BIND=127.0.0.1 en el .env este puerto queda solo
      # para este equipo.
      - "${SERVER_BIND:-0.0.0.0}:8000:8000"
    volumes:
      # El codigo va dentro de la imagen (modo produccion). Para desarrollo,
      # con el codigo montado y recarga al editar: docker-compose.dev.yml.
      - ./.env:/config/.env
      # Base GeoIP: la descarga Configuracion > Mapa de ataques o
      # scripts/update_geoip_db.sh, y sobrevive a reconstruir la imagen.
      - ./server/data:/app/data
      # Lectura del estado de los respaldos y pedido de "Respaldar ahora".
      - ./backups:/backups

  cloudflared:
    # Tunel de Cloudflare: publica el panel en tu dominio con HTTPS, sin
    # abrir puertos. Opcional: se activa con COMPOSE_PROFILES=cloudflare y
    # CLOUDFLARE_TUNNEL_TOKEN en el .env (ver docs/INSTALACION.md). En el
    # panel de Cloudflare, el servicio del hostname publico es
    # http://server:8000.
    # Version fija, como las demas imagenes; "--no-autoupdate" porque la
    # actualiza Compose, no cloudflared.
    image: cloudflare/cloudflared:2026.10.7
    profiles: ["cloudflare"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - server

  backup:
    # Misma imagen que la base: su pg_dump es de la misma version.
    image: timescale/timescaledb:2.32.0-pg16
    restart: unless-stopped
    env_file:
      - .env
    entrypoint: ["/bin/sh", "/scripts/backup_loop.sh"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./scripts/backup_loop.sh:/scripts/backup_loop.sh:ro
      - ./backups:/backups
      - ./.env:/config/.env:ro

volumes:
  db_data:
  ollama_data:

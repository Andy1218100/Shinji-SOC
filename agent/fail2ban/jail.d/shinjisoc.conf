# logpath: archivo propio y vacio (lo crea install.sh). El filtro nunca
# matchea: este jail solo recibe bloqueos manuales desde el panel.
[shinjisoc]
enabled = true
filter = shinjisoc
logpath = /var/log/shinji-soc-fail2ban.log
backend = polling
maxretry = 999999
findtime = 86400
bantime = 3600
action = %(action_)s

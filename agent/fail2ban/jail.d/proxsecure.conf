# logpath: archivo propio y vacio (lo crea install.sh). El filtro nunca
# matchea: este jail solo recibe bloqueos manuales desde el panel.
[proxsecure]
enabled = true
filter = proxsecure
logpath = /var/log/prox-secure-fail2ban.log
backend = polling
maxretry = 999999
findtime = 86400
bantime = 3600
action = %(action_)s

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Prox Secure{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/app.css" />
  <script src="https://unpkg.com/htmx.org@2.0.3"></script>
  <script>
    (function () {
      try {
        if (!localStorage.getItem("proxsecure_admin_key")) {
          location.href = "/login?next=" + encodeURIComponent(location.pathname);
        }
      } catch (e) {
        /* storage blocked: let the page load, API calls will 401 and redirect via app.js */
      }
    })();
  </script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        {% from "_icons.html" import icon %}
        {{ icon("shield", "icon") }}
        <span>Prox Secure</span>
      </div>
      <nav class="nav">
        <a class="nav-link {{ 'active' if active_nav == 'monitoreo' else '' }}" href="/">
          {{ icon("activity") }}
          <span class="label">Monitoreo</span>
        </a>
        <a class="nav-link {{ 'active' if active_nav == 'seguridad' else '' }}" href="/security">
          {{ icon("shield") }}
          <span class="label">Seguridad</span>
          <span class="nav-badge" data-nav="security" data-count="0">0</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <button class="signout" data-action="sign-out" type="button">
          {{ icon("logout") }}
          <span>Cerrar sesion</span>
        </button>
      </div>
    </aside>
    <main class="content">{% block content %}{% endblock %}</main>
  </div>
  <script src="/static/js/app.js"></script>
</body>
</html>
